name: NestJS CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nest_tasks_prisma?schema=public

      - name: Run tests
        run: npm run test

      - name: Build NestJS application
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
  uses: docker/build-push-action@v6
  with:
    context: .
    push: true
    tags: |
      ${{ secrets.DOCKERHUB_LOGIN }}/nest-tasks:latest
      ${{ secrets.DOCKERHUB_LOGIN }}/nest-tasks:${{ github.sha }}

  deploy-heroku:
    runs-on: ubuntu-latest
    needs: test-build-push
    if: ${{ vars.ENABLE_HEROKU_DEPLOY == 'true' }}
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to Heroku Container Registry
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          echo "$HEROKU_API_KEY" | docker login \
            --username=_ \
            --password-stdin \
            registry.heroku.com

      - name: Pull and push image to Heroku
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_LOGIN }}
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
        run: |
          IMAGE="$DOCKERHUB_LOGIN/nest-tasks:${GITHUB_SHA}"
          HEROKU_IMAGE="registry.heroku.com/$HEROKU_APP_NAME/web"
          docker pull "$IMAGE"
          docker tag "$IMAGE" "$HEROKU_IMAGE"
          docker push "$HEROKU_IMAGE"

      - name: Install Heroku CLI
        run: curl https://cli-assets.heroku.com/install.sh | sh

      - name: Release application on Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
        run: heroku container:release web --app "$HEROKU_APP_NAME"
