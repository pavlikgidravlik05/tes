
name: NestJS CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nestjs-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build-push:
    name: Test, Build and Push Docker
    runs-on: ubuntu-latest

    steps:
      # Получение исходного кода
      - name: Checkout repository
        uses: actions/checkout@v4

      # Установка Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Установка зависимостей
      - name: Install dependencies
        run: npm install

      # Проверка тестов
      - name: Run tests
        run: npm run test

      # Сборка NestJS
      - name: Build NestJS
        run: npm run build

      # Проверка наличия Docker Hub Secrets
      - name: Check Docker Hub credentials
        env:
          DOCKERHUB_LOGIN: ${{ secrets.DOCKERHUB_LOGIN }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_LOGIN" ]; then
            echo "DOCKERHUB_LOGIN secret is missing"
            exit 1
          fi

          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "DOCKERHUB_TOKEN secret is missing"
            exit 1
          fi

      # Настройка Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Авторизация в Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Сборка и публикация Docker-образа
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_LOGIN }}/nest-tasks:latest
            ${{ secrets.DOCKERHUB_LOGIN }}/nest-tasks:${{ github.sha }}

      # Необязательное развёртывание на Heroku
      - name: Login to Heroku Container Registry
        if: vars.ENABLE_HEROKU_DEPLOY == 'true'
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          if [ -z "$HEROKU_API_KEY" ]; then
            echo "HEROKU_API_KEY secret is missing"
            exit 1
          fi

          echo "$HEROKU_API_KEY" | docker login \
            --username=_ \
            --password-stdin \
            registry.heroku.com

      - name: Push image to Heroku
        if: vars.ENABLE_HEROKU_DEPLOY == 'true'
        env:
          DOCKERHUB_LOGIN: ${{ secrets.DOCKERHUB_LOGIN }}
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
        run: |
          if [ -z "$HEROKU_APP_NAME" ]; then
            echo "HEROKU_APP_NAME secret is missing"
            exit 1
          fi

          docker pull "$DOCKERHUB_LOGIN/nest-tasks:${GITHUB_SHA}"

          docker tag \
            "$DOCKERHUB_LOGIN/nest-tasks:${GITHUB_SHA}" \
            "registry.heroku.com/$HEROKU_APP_NAME/web"

          docker push "registry.heroku.com/$HEROKU_APP_NAME/web"

      - name: Install Heroku CLI
        if: vars.ENABLE_HEROKU_DEPLOY == 'true'
        run: |
          curl https://cli-assets.heroku.com/install.sh | sh

      - name: Release Heroku application
        if: vars.ENABLE_HEROKU_DEPLOY == 'true'
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
        run: |
          heroku container:release web --app "$HEROKU_APP_NAME"
